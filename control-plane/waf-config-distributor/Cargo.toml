[package]
name = "waf-config-distributor"
version = "0.1.0"
edition = "2021"

[dependencies]
# `control-plane` DOES depend on `metap` — unlike `edge-plane`, which deliberately does not.
# It only uses the plumbing (`metap::runtime`: HTTP client, service-account token, shutdown
# signal, serve loop) and the event bus (`metap::infra`), never `CrudService`/`MetadataRegistry`:
# this process talks to `data-plane` over its API, not through its internals.
metap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
