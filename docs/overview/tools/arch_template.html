<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* layout: sidebar mục lục cố định bên trái + một cột đọc; trên điện thoại mục lục gập lại ở đầu trang */
:root {
  --bg: #f5f6f3;
  --surface: #ffffff;
  --ink: #1b2220;
  --muted: #5b6863;
  --line: #d6dbd6;
  --soft: #eceee9;
  --accent: #0d6b62;
  --font-display: "IBM Plex Mono", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131718; --surface: #1b2022; --ink: #edf0eb; --muted: #9ba79f;
    --line: #353e3c; --soft: #232a28; --accent: #4cc5b8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131718; --surface: #1b2022; --ink: #edf0eb; --muted: #9ba79f;
  --line: #353e3c; --soft: #232a28; --accent: #4cc5b8; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 40px; padding-block: 28px 80px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 8px; }
.brand { font: 600 15px/1.3 var(--font-display); margin: 0 0 4px; }
.brand-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
nav.toc a { display: block; text-decoration: none; color: var(--muted); font-size: 13px; line-height: 1.35; padding: 4px 8px; border-radius: 6px; }
nav.toc a:hover { background: var(--soft); color: var(--ink); }
nav.toc a.top { color: var(--ink); font-weight: 600; margin-top: 10px; }
nav.toc a.sub { padding-left: 18px; }
nav.toc a.sub2 { padding-left: 30px; font-size: 12.5px; }
nav.toc a.active { background: var(--soft); color: var(--accent); }
nav.toc a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
details.mtoc { display: none; }

main { min-width: 0; }
section.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px 30px; margin-bottom: 24px; min-width: 0; }
.path { font: 11.5px var(--font-display); color: var(--muted); letter-spacing: 0.02em; margin-bottom: 10px; }
section.doc h1 { font: 600 24px/1.25 var(--font-display); margin: 0 0 16px; letter-spacing: -0.01em; text-wrap: balance; }
section.doc h2 { font: 600 19px/1.3 var(--font-body); margin: 30px 0 10px; text-wrap: balance; }
section.doc h3 { font: 600 16px/1.35 var(--font-body); margin: 24px 0 8px; }
section.doc p, section.doc ul, section.doc ol { max-width: 80ch; }
section.doc p { margin: 0 0 12px; }
section.doc ul, section.doc ol { padding-left: 22px; margin: 0 0 14px; }
section.doc li { margin: 3px 0; }
a { color: var(--accent); }
code { font-family: var(--font-display); font-size: 0.86em; background: var(--soft); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
pre.code { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 0 0 16px; }
pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 4px 0 18px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11.5px var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td { min-width: 120px; }
.diagram { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 6px 0 20px; overflow-x: auto; }
.diagram pre.mermaid { margin: 0; text-align: center; background: transparent; }
blockquote { margin: 0 0 14px; padding: 8px 16px; border-left: 3px solid var(--line); color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
  nav.toc { display: none; }
  details.mtoc { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  details.mtoc summary { font: 600 14px var(--font-display); cursor: pointer; }
  details.mtoc a { display: block; padding: 5px 0; font-size: 13.5px; color: var(--ink); text-decoration: none; }
  details.mtoc a.sub { padding-left: 12px; color: var(--muted); }
  details.mtoc a.sub2 { padding-left: 24px; color: var(--muted); }
  section.doc { padding: 20px 18px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>


<div class="shell">
  <nav class="toc" aria-label="Mục lục">
    <div class="brand">{{BRAND}}</div>
    <div class="brand-sub">{{BRAND_SUB}}</div>
    {{NAV}}
  </nav>
  <main>
    <details class="mtoc">
      <summary>Mục lục</summary>
      {{NAV}}
    </details>
    {{CONTENT}}
  </main>
</div>

<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
  if (!('IntersectionObserver' in window)) return;
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) { a.classList.remove('active'); });
      var a = byId[e.target.id];
      if (a) {
        a.classList.add('active');
        var nav = document.querySelector('nav.toc');
        var r = a.getBoundingClientRect(), n = nav.getBoundingClientRect();
        if (r.top < n.top || r.bottom > n.bottom) a.scrollIntoView({ block: 'nearest' });
      }
    });
  }, { rootMargin: '0px 0px -70% 0px' });
  document.querySelectorAll('section.doc').forEach(function (s) { obs.observe(s); });
  document.querySelectorAll('details.mtoc a').forEach(function (a) {
    a.addEventListener('click', function () { a.closest('details').open = false; });
  });
})();
</script>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
const dark = document.documentElement.dataset.theme === "dark" ||
  (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict", flowchart: { htmlLabels: true } });
await mermaid.run({ querySelector: "pre.mermaid" });
</script>
</body>
</html>
