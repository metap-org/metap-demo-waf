# Production-mode substitute for `vite.config.ts`'s dev-only `configureServer` middleware
# (`waf-multi-service-routing`) — that plugin only runs under `vite dev`/`vite preview`, not in
# this Dockerfile's `vite build` + static-nginx setup, so the entity-based routing has to be
# reimplemented here. Upstream hostnames are the docker-compose service names from
# `../docker-compose.yml` (same compose network) — this file is baked into the image at build
# time, so it is specific to running inside that compose network, not a general-purpose config.
#
# KNOWN GAP, not fixed here: `location = /metadata/entities` below proxies to zones-service ONLY.
# The dev middleware's `mergeEntityList()` fans out to all 3 services and merges `{ data: [...] }`
# because no single service owns the full entity list; stock nginx can't merge 3 upstream JSON
# responses into one (would need njs/OpenResty, a bigger addition than this pass adds). Production
# nav built from this image will only show zones-service's 3 entities
# (waf.zones/waf.ddos_policies/waf.firewall_rules), silently missing the other 6 — same class of
# already-flagged, not-yet-built gap as the Traefik/reverse-proxy TODO in `../README.md`.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every `proxy_pass` target below is a variable, not a literal `http://host:port`, and
    # `resolver` is Docker's own embedded DNS (127.0.0.11 in every container on a compose
    # network) — this makes nginx re-resolve each upstream hostname per-request instead of once
    # at master-process startup. Found live (2026-09-02): a literal `proxy_pass
    # http://zones-service:3000;` resolves synchronously at startup, and if that resolution loses
    # a race against the container's own network/embedded-DNS becoming ready (a few hundred ms,
    # seen repeatedly on this WSL2 host under load), nginx fails with "host not found in upstream"
    # and exits — no retry, the whole container dies. A per-request variable resolve tolerates
    # that same race by simply 502-ing the first request or two instead of never starting.
    resolver 127.0.0.11 valid=10s;

    # Exact match only — see the KNOWN GAP note above for why this doesn't fan out to all 3.
    location = /metadata/entities {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones/metadata/entities;
    }

    # Mirrors web/vite.config.ts's targetForEntity() — most specific prefix first.
    location ~ ^/(api|metadata/entities)/waf\.scan_ {
        set $upstream_scanning "http://scanning-service:3010";
        proxy_pass $upstream_scanning;
    }

    location ~ ^/(api|metadata/entities)/(waf\.security_events|waf\.incidents|waf\.alert_) {
        set $upstream_alerting "http://alerting-service:3020";
        proxy_pass $upstream_alerting;
    }

    # Default fallback (waf.zones / waf.ddos_policies / waf.firewall_rules, and any future
    # zones-owned entity) — same default `targetForEntity()` uses.
    location ~ ^/(api|metadata/entities)/waf\. {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }

    # Not entity-specific — zones-service is representative for dev/prod alike, same reasoning
    # `vite.config.ts`'s static proxy table uses.
    location /metadata {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }
    location /health {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }
    location /preferences {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }
    location /auth {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }
    location /admin {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }
    # Tenant user list — was simply missing here (same gap as `vite.config.ts`'s proxy table,
    # fixed alongside it 2026-09-02) until this app got its first consumer of `GET /users`.
    location /users {
        set $upstream_zones "http://zones-service:3000";
        proxy_pass $upstream_zones;
    }

    # WAF graphql-gateway instance — supports mutations too now, not query-only (2026-09-02, see
    # ../graphql-gateway/README.md's Auth section).
    location /graphql {
        set $upstream_gateway "http://graphql-gateway:4000";
        proxy_pass $upstream_gateway;
    }

    # React Router client-side routes — anything not matched above falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
