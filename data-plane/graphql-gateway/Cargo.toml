[package]
name = "waf-graphql-gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "waf-graphql-gateway"
path = "src/main.rs"

[dependencies]
# Local dev: path dep into the sibling ../../../metap checkout (no crates.io publish yet), one
# level shallower than services/*/Cargo.toml's `../../../../metap/...` since this crate lives
# directly under data-plane/, not under data-plane/services/. Swap to `git = ...` for CI/deploy
# once this stabilizes on a real branch/tag, same convention as every other crate here.
metap-graphql-gateway = { path = "../../../metap/crates/metap-graphql-gateway" }
metap-graphql = { path = "../../../metap/crates/metap-graphql" }
metap-infra = { path = "../../../metap/crates/metap-infra" }
metap-permission = { path = "../../../metap/crates/metap-permission" }
metap-runtime = { path = "../../../metap/crates/metap-runtime" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
