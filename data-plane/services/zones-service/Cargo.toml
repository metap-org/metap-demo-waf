[package]
name = "zones-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local dev: path dep into the sibling ../../../../metap checkout (no crates.io publish yet).
# Swap to `git = "git@github.com:metap-org/metap.git", branch = "..."` for CI/deploy once this
# stabilizes on a real branch/tag.
metap = { path = "../../../../metap/crates/metap" }
metap-reconciler = { path = "../../../../metap/crates/metap-reconciler" }
# The low-code entity-builder admin API (`/admin/lowcode/*`) — merged directly into this
# service's own process (not run as `../../../../metap-lowcode/services/lowcode-admin-api`, a
# separate service) because that standalone-service deployment has an unbuilt registry-
# distribution gap (see `presenter`'s own crate-level doc comment, "Phase 53's T3/T5"): a
# `publish`/`rollback` there updates only *that other process's* in-memory registry, which this
# service's own `/api/:entity*` traffic would never see. Merged in-process, `apply_registry`
# updates *this* process's live `MetadataRegistry` directly — the same pattern the now-deprecated
# `metap-demo-crm/src/main.rs` used before this repo split the low-code crates out.
presenter = { path = "../../../../metap-lowcode/crates/presenter" }
anyhow = "1"
arc-swap = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
# `entities/zone_entity.rs`'s workflow guard literals (`json!(true)`, `json!("verified")`) —
# the only entity module across the 3 services that needs this.
serde_json = "1"
# `src/routes.rs`: the cross-service delete guard (calls the sibling pillar services), the DoH
# lookup behind `verify-dns`, and the origin probe behind `test-origin` — all HTTP calls out,
# which is exactly what makes those endpoints things `metap`'s generic CRUD can't generate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
# `firewall_rule_match_condition_guard` (src/routes.rs) validates a regex `matchCondition`
# actually compiles before letting the write through — same check
# `control-plane/waf-config-distributor/src/compile.rs` does later, just surfaced immediately
# instead of silently dropping the rule at compile time.
regex = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
] }
jsonwebtoken = "9"
