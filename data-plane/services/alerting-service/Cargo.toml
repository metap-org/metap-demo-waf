[package]
name = "alerting-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local dev: path dep into the sibling ../../../../metap checkout (no crates.io publish yet).
# Swap to `git = "git@github.com:metap-org/metap.git", branch = "..."` for CI/deploy once this
# stabilizes on a real branch/tag.
metap = { path = "../../../../metap/crates/metap" }
anyhow = "1"
arc-swap = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
# `src/routes.rs`: incident correlation + alert evaluation (both read a set of records and decide,
# which generic CRUD can't express) and webhook delivery for a firing alert.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
] }
jsonwebtoken = "9"
