[workspace]
resolver = "2"
members = [
    "services/zones-service",
    "services/scanning-service",
    "services/alerting-service",
]

# No root package — `data-plane/` stopped being 1 binary and became a workspace of 3
# (2026-09-01, pillar split: zones-service/scanning-service/alerting-service). See
# `services/*/README.md` and each service's `main.rs` doc comment for what each one owns and
# why. This file only lists workspace members; per-service dependencies live in each member's
# own `Cargo.toml`, same as `metap`'s own root `Cargo.toml` for its `crates/*` members.

# Dev iteration speed (2026-09-03) — identical byte-for-byte across every Rust repo in metap-org
# (metap, metap-lowcode, metap-demo-crm, metap-demo-jira, metap-demo-waf/data-plane). Must stay
# identical: these 5 repos share 1 target-dir (`.cargo/config.toml`'s `target-dir`, see that
# file's comment) keyed by cargo's profile fingerprint — a mismatched [profile.dev] in just one
# repo means it rebuilds every shared dependency under its own fingerprint instead of reusing what
# the other 4 already compiled, defeating the whole shared-target-dir setup.
[profile.dev]
# "line-tables-only" still gives panic/backtrace line numbers but skips the full variable/type
# debuginfo LLVM would otherwise emit per crate — a real, measurable compile-time cut, at the cost
# of not being able to inspect local variables in gdb/lldb.
debug = "line-tables-only"
# Linux's cargo default is "off" (debuginfo embedded directly in each object file); "unpacked"
# writes it to separate files instead, so the final link step doesn't have to copy it into the
# binary on every rebuild.
split-debuginfo = "unpacked"
